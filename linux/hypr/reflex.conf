# Reflex (linux/omarchy) — sourced from ~/.config/hypr/bindings.conf
#
# The macOS app listens for a double-tap of Option; Hyprland has no
# multi-tap bindings, so Reflex gets two explicit chords instead. Omarchy
# already owns SUPER ALT SPACE (apps menu) and SUPER ALT R is free, so ask
# sits on A next to sessions on R.
#
# Sessions are the bar widget's panel. The ask surface is a normal toplevel
# and is deliberately not floated: it tiles like other apps. Toggle floating
# with your Hyprland bind to drag it by its header.
#
# If your Hyprland reads hyprland.lua instead of hyprland.conf, use the
# sibling reflex.lua — this file is not read at all in that case.

bindd = SUPER ALT, R, Reflex sessions and questions, exec, omarchy-shell shell toggle reflex.sessions '{}'
bindd = SUPER ALT, A, Reflex ask, exec, omarchy-shell shell summon reflex '{"mode":"ask"}'
