# Reflex (linux/omarchy) — sourced from ~/.config/hypr/bindings.conf
#
# The macOS app listens for a double-tap of Option; Hyprland has no
# multi-tap bindings, so Reflex gets two explicit chords instead:
#
#   SUPER ALT R      every session, and every question waiting on you
#   SUPER ALT SPACE  the ask bar, which opens straight into ask mode
#
# Both go through omarchy-shell so the overlay is summoned by the shell that
# already owns the layer surfaces, and closes the same way (esc).

bindd = SUPER ALT, R, Reflex sessions, exec, omarchy-shell shell toggle reflex '{}'
bindd = SUPER ALT, SPACE, Reflex ask, exec, omarchy-shell shell summon reflex '{"mode":"ask"}'
